<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diluvium Lab</title>
<!-- The version this HTML belongs to, compared at startup against the
     version compiled into src/version.js. They can only disagree if the
     browser (or a CDN) is holding one of them from an older deploy, which
     is otherwise a silent failure: stale modules do not throw, they just
     quietly lack the newer half of the page. scripts/check-version.mjs
     keeps this in step with package.json and src/version.js. -->
<meta name="diluvium-lab-build" content="0.1.0">
<style>
  :root {
    color-scheme: light dark;
    --edge: color-mix(in srgb, currentColor 18%, transparent);
    --sunk: color-mix(in srgb, currentColor 5%, transparent);
    --quiet: color-mix(in srgb, currentColor 60%, transparent);
    --ok: #1a7f37;
    --bad: #b91c1c;
    /* The page's real text colour, named so it can be used where
       `currentColor` has been deliberately set to transparent. */
    --ink: CanvasText;
    --accent: Highlight;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* Several rules below set `display`, which would otherwise beat the UA
     stylesheet's [hidden] rule and leave "hidden" elements on screen. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  /* --- toolbar --- */
  .toolbar {
    display: flex; align-items: center; gap: .4rem; flex-wrap: wrap;
    padding: .5rem .75rem; border-bottom: 1px solid var(--edge);
  }
  .toolbar .title { font-weight: 650; margin-right: .5rem; }
  .toolbar .spacer { flex: 1; }
  .toolbar button, .cell-tools button, .show-all {
    font: inherit; font-size: .85rem; padding: .25rem .55rem;
    border: 1px solid var(--edge); border-radius: 6px;
    background: transparent; color: inherit; cursor: pointer;
  }
  .toolbar button:hover, .cell-tools button:hover, .show-all:hover { background: var(--sunk); }
  .sep { width: 1px; height: 1.4rem; background: var(--edge); margin: 0 .25rem; }
  [data-filename] { font-family: var(--mono); font-size: .82rem; color: var(--quiet); }

  .version { display: flex; align-items: center; gap: .35rem; font-size: .8rem; }
  .version-label { color: var(--quiet); }
  .version select {
    font: inherit; font-size: .8rem; font-family: var(--mono);
    padding: .2rem .3rem; border-radius: 6px;
    border: 1px solid var(--edge); background: transparent; color: inherit;
  }
  body[data-switching="true"] .toolbar, body[data-checking="true"] .toolbar { opacity: .6; }

  .status {
    font-size: .8rem; font-family: var(--mono);
    padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--edge);
  }
  .status[data-status="idle"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .status[data-status="busy"] { color: #b45309; }
  .status[data-status="dead"] { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

  /* --- cells --- */
  .sheet { overflow: auto; padding: 1rem .75rem 4rem; }
  .cells { max-width: 62rem; margin: 0 auto; display: flex; flex-direction: column; gap: .5rem; }

  .cell { border: 1px solid transparent; border-radius: 8px; padding: .35rem .5rem; }
  .cell:focus-within { border-color: var(--edge); background: var(--sunk); }
  .cell[data-busy="true"] { border-color: color-mix(in srgb, #b45309 45%, transparent); }
  .cell-head { display: flex; align-items: center; gap: .5rem; min-height: 1.6rem; }
  .prompt {
    font-family: var(--mono); font-size: .78rem; color: var(--quiet);
    min-width: 5.5rem; user-select: none;
  }
  /* Dimmed rather than hidden: a hover-only toolbar does not exist on a
     touch screen, and cannot be reached by keyboard at all. */
  .cell-tools { display: flex; gap: .25rem; margin-left: auto; opacity: .3; transition: opacity .12s; }
  .cell:hover .cell-tools, .cell:focus-within .cell-tools { opacity: 1; }

  /* Every property here affects where a glyph lands, and the highlight
     overlay must land on exactly the same pixels as the textarea. Change
     one, change both -- test/highlight.spec.js measures that they agree. */
  textarea[data-editor], [data-console-input], .editor-highlight {
    font-family: var(--mono); font-size: .88rem; line-height: 1.45;
    letter-spacing: normal; tab-size: 2;
    padding: .45rem .55rem;
    border: 1px solid var(--edge); border-radius: 6px;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
    margin: 0;
  }
  textarea[data-editor], [data-console-input] {
    display: block; width: 100%; resize: vertical;
    background: var(--sunk); color: inherit;
  }

  /* --- highlighted editor ---
     The textarea sits on top with transparent glyphs; the coloured copy is
     the <pre> behind it. Two things must therefore be spelled out in a
     real colour rather than `currentColor`: inside the textarea
     `currentColor` *is* transparent, which is the whole point, so a caret
     or a selection defined that way is defined as invisible. --ink is the
     page's actual text colour, which is what CanvasText means. */
  .editor-wrap { position: relative; }
  .editor-wrap > textarea[data-editor], .editor-wrap > [data-console-input] {
    position: relative; z-index: 1;
    background: transparent;
    color: transparent;
    caret-color: var(--ink);
  }
  /* The selection rectangle is painted by the textarea, above the <pre>, so
     it has to be translucent or it hides the very text it is selecting.
     The foreground is pinned transparent too: without it the UA supplies
     its own selected-text colour and the glyphs double up. */
  .editor-wrap > textarea::selection {
    background: color-mix(in srgb, var(--accent) 32%, transparent);
    color: transparent;
  }
  .editor-highlight {
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
    border-color: transparent; background: var(--sunk);
  }
  .editor-highlight code { font: inherit; }

  .tok-keyword  { color: #8250df; font-weight: 600; }
  .tok-builtin  { color: #0550ae; }
  .tok-constant { color: #6639ba; }
  .tok-string   { color: #0a7c42; }
  .tok-string-prefix { color: #0a7c42; font-weight: 700; }
  .tok-interp-brace  { color: #bc4c00; font-weight: 700; }
  .tok-number   { color: #0550ae; }
  .tok-comment  { color: color-mix(in srgb, currentColor 55%, transparent); font-style: italic; }
  .tok-operator { color: color-mix(in srgb, currentColor 75%, transparent); }
  @media (prefers-color-scheme: dark) {
    .tok-keyword  { color: #d2a8ff; }
    .tok-builtin  { color: #79c0ff; }
    .tok-constant { color: #d2a8ff; }
    .tok-string   { color: #7ee787; }
    .tok-string-prefix { color: #7ee787; }
    .tok-interp-brace  { color: #ffa657; }
    .tok-number   { color: #79c0ff; }
  }
  .cell[data-cell-type="markdown"][data-editing="false"] .rendered { padding: 0 .1rem; }
  .rendered h1 { font-size: 1.5rem; } .rendered h2 { font-size: 1.25rem; }
  .rendered h3 { font-size: 1.05rem; }
  .rendered pre { background: var(--sunk); padding: .5rem .6rem; border-radius: 6px; overflow-x: auto; }
  .rendered code { font-family: var(--mono); font-size: .88em; }
  .rendered blockquote { margin: 0; padding-left: .8rem; border-left: 3px solid var(--edge); color: var(--quiet); }

  /* --- outputs --- */
  .outputs { display: flex; flex-direction: column; gap: .25rem; margin: .3rem 0 0 5.5rem; }
  .outputs:empty { margin: 0; }
  .output pre {
    margin: 0; font-family: var(--mono); font-size: .84rem;
    white-space: pre-wrap; word-break: break-word;
  }
  .output-stream[data-stream="stderr"] pre { color: #b45309; }
  .output-execute_result { display: flex; gap: .5rem; align-items: baseline; }
  .result-prompt { font-family: var(--mono); font-size: .78rem; color: var(--quiet); }
  .output-error {
    border-left: 3px solid var(--bad); padding-left: .55rem;
  }
  .error-name { color: var(--bad); font-family: var(--mono); font-size: .84rem; font-weight: 600; }
  .traceback { color: var(--quiet); }
  .show-all { align-self: flex-start; font-size: .78rem; margin-top: .15rem; }

  /* Plain-English help, under the runtime's own message and clearly not
     part of it. */
  .hint {
    margin: .25rem 0 0; padding: .35rem .55rem;
    font-size: .84rem; line-height: 1.45;
    border-radius: 6px; background: var(--sunk);
    color: color-mix(in srgb, currentColor 80%, transparent);
  }
  .hint code {
    font-family: var(--mono); font-size: .92em;
    background: color-mix(in srgb, currentColor 8%, transparent);
    padding: .05rem .2rem; border-radius: 3px;
  }
  .output-error .hint { border-left: 3px solid color-mix(in srgb, var(--bad) 45%, transparent); }

  /* --- bytecode panel --- */
  .bytecode { margin: .4rem 0 0 5.5rem; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .bc-tabs { display: flex; align-items: center; gap: .25rem; padding: .3rem .45rem; background: var(--sunk); }
  .bc-tab {
    font: inherit; font-size: .78rem; padding: .15rem .5rem; cursor: pointer;
    border: 1px solid transparent; border-radius: 5px; background: transparent; color: inherit;
  }
  .bc-tab[data-active="true"] { border-color: var(--edge); background: Canvas; }
  .bc-summary { margin-left: auto; font-family: var(--mono); font-size: .74rem; color: var(--quiet); }
  .bc-body { padding: .5rem .6rem; overflow-x: auto; }
  .bc-fn { margin: .5rem 0 .3rem; font-size: .8rem; font-weight: 600; color: var(--quiet); }
  .bc-proto:first-child .bc-fn { margin-top: 0; }
  .bc-table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; width: 100%; }
  .bc-table td { padding: .05rem .5rem .05rem 0; vertical-align: top; white-space: nowrap; }
  .bc-pc { color: var(--quiet); text-align: right; }
  .bc-line { color: var(--quiet); }
  .bc-op { color: #8250df; font-weight: 600; }
  .bc-comment { color: var(--quiet); white-space: pre-wrap; }
  .bc-aside { font-family: var(--mono); font-size: .76rem; color: var(--quiet); margin-top: .25rem; }
  .bc-const { margin-right: .5rem; }
  .bc-hex { font-family: var(--mono); font-size: .76rem; margin: 0; white-space: pre; overflow-x: auto; }
  .bc-actions { display: flex; gap: .4rem; margin-top: .5rem; }
  .bc-action {
    font: inherit; font-size: .78rem; padding: .2rem .5rem; cursor: pointer;
    border: 1px solid var(--edge); border-radius: 6px; background: transparent; color: inherit;
  }
  .bc-paste { width: 100%; font-family: var(--mono); font-size: .78rem; padding: .4rem;
              border: 1px solid var(--edge); border-radius: 6px; background: var(--sunk); color: inherit; }
  .bc-note { font-size: .8rem; color: var(--quiet); margin: .2rem 0 .4rem; }
  .bc-error { padding: .5rem .6rem; color: var(--bad); font-size: .85rem; }
  .bc-error .bc-note { color: var(--quiet); }
  @media (prefers-color-scheme: dark) { .bc-op { color: #d2a8ff; } }

  /* --- completion --- */
  .completions {
    position: absolute; z-index: 5; left: .55rem; top: 100%;
    margin: .15rem 0 0; padding: .2rem; list-style: none;
    min-width: 12rem; max-height: 15rem; overflow-y: auto;
    border: 1px solid var(--edge); border-radius: 8px;
    background: Canvas; box-shadow: 0 6px 18px color-mix(in srgb, CanvasText 18%, transparent);
    font-family: var(--mono); font-size: .84rem;
  }
  .completions li { padding: .15rem .45rem; border-radius: 4px; cursor: pointer; }
  .completions li[data-active="true"] { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .completions li:hover { background: var(--sunk); }
  .completions-more { color: var(--quiet); cursor: default; font-style: italic; }

  /* --- console --- */
  .console {
    border-top: 1px solid var(--edge); display: grid; grid-template-rows: auto 1fr auto;
    max-height: 38vh; min-height: 8.5rem;
  }
  .console-head {
    display: flex; align-items: center; gap: .5rem;
    padding: .3rem .75rem; font-size: .78rem; color: var(--quiet);
    border-bottom: 1px solid var(--edge);
  }
  [data-console-log] { overflow: auto; padding: .5rem .75rem; font-size: .84rem; }
  [data-console-log] pre { margin: 0; font-family: var(--mono); white-space: pre-wrap; word-break: break-word; }
  .console-entry { display: flex; gap: .4rem; color: var(--quiet); }
  .console-caret { font-family: var(--mono); }
  .console-result { color: var(--ok); }
  .console-error { color: var(--bad); }
  .console-note { color: var(--quiet); font-style: italic; }
  .console-input-row { padding: .4rem .75rem .6rem; }

  [data-toast] {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
    padding: .5rem .9rem; border-radius: 8px; border: 1px solid var(--edge);
    background: Canvas; font-size: .86rem; z-index: 10;
  }
  [data-toast][data-kind="error"] { border-color: var(--bad); color: var(--bad); }
  /* --- touch and small screens ---
     The pitch is "try the language with nothing installed", which is
     strongest exactly where installing is hardest: a phone. These rules
     are keyed off `pointer: coarse` rather than a width, because the
     thing that changes is the input device, not the viewport. */
  @media (pointer: coarse) {
    /* 44px is the usual floor for a touch target. The toolbar buttons
       were about 24px tall, which is a miss more often than a hit. */
    .toolbar button, .cell-tools button, .show-all,
    .version select, [data-console-input] {
      min-height: 44px;
      padding-inline: .7rem;
    }
    /* iOS zooms the page in when a focused field is under 16px, and does
       not zoom back out. The overlay must match or the highlight drifts
       off the glyphs -- both boxes, always. */
    textarea[data-editor], [data-console-input], .editor-highlight {
      font-size: 16px;
    }
    /* There is no hover on a touch screen, so a toolbar revealed by it is
       a toolbar that is permanently dimmed. */
    .cell-tools { opacity: 1; }
  }

  @media (max-width: 34rem) {
    .sheet { padding: .5rem .4rem 4rem; }
    .cell { padding: .35rem .25rem; }
    /* Outputs were indented to line up under the prompt, which on a
       narrow screen spends a third of the width on alignment. */
    .outputs { margin-left: 0; }
    .prompt { min-width: 0; }
    .toolbar { gap: .3rem; padding: .4rem .5rem; }
    .toolbar .title { width: 100%; margin-right: 0; }
  }

  /* Nothing here is load-bearing animation, so honour the preference
     rather than making someone watch it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* --- about --- */
  dialog[data-about] {
    max-width: min(46rem, calc(100vw - 2rem));
    border: 1px solid var(--edge); border-radius: 10px;
    padding: 1rem 1.1rem; background: Canvas; color: CanvasText;
  }
  dialog[data-about]::backdrop { background: rgb(0 0 0 / .4); }
  dialog[data-about] h2 { margin: 0 0 .6rem; font-size: 1.1rem; }
  dialog[data-about] dl {
    display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem;
    margin: 0 0 .8rem; font-size: .85rem;
  }
  dialog[data-about] dt { color: var(--quiet); }
  dialog[data-about] dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
  .about-note { font-size: .82rem; color: var(--quiet); margin: .2rem 0 .4rem; }
  [data-about-report] {
    font-family: var(--mono); font-size: .76rem; margin: 0 0 .8rem;
    background: var(--sunk); border: 1px solid var(--edge); border-radius: 6px;
    padding: .5rem .6rem; max-height: 14rem; overflow: auto; white-space: pre-wrap;
  }
  .about-actions { display: flex; gap: .5rem; justify-content: flex-end; }
  .about-actions button {
    font: inherit; font-size: .85rem; padding: .3rem .7rem;
    border: 1px solid var(--edge); border-radius: 6px;
    background: transparent; color: inherit; cursor: pointer;
  }
  @media (max-width: 34rem) {
    dialog[data-about] dl { grid-template-columns: 1fr; gap: 0 0; }
    dialog[data-about] dt { margin-top: .45rem; }
  }

</style>
</head>
<body>

<header class="toolbar">
  <span class="title">Diluvium Lab</span>
  <button type="button" data-toolbar="add-code">+ Code</button>
  <button type="button" data-toolbar="add-markdown">+ Markdown</button>
  <span class="sep"></span>
  <button type="button" data-toolbar="run-all">Run all</button>
  <button type="button" data-toolbar="clear-outputs">Clear outputs</button>
  <span class="sep"></span>
  <button type="button" data-toolbar="open">Open…</button>
  <button type="button" data-toolbar="save">Save .ipynb</button>
  <input type="file" data-file-input accept=".ipynb,application/json" hidden>
  <span data-filename></span>
  <span class="spacer"></span>
  <label class="version">
    <span class="version-label">Runtime</span>
    <select data-version-select aria-label="Diluvium runtime"></select>
  </label>
  <button type="button" data-toolbar="check-versions" title="Look for other Diluvium builds on the mirror">⟳</button>
  <span class="sep"></span>
  <!-- Says "Stop", not "Interrupt", on purpose. Jupyter's interrupt
       unwinds and leaves your variables alone; this terminates the worker,
       which is the only way to stop a synchronous WASM call, and takes the
       Lua state with it. The title says so and so does the console note. -->
  <button type="button" data-toolbar="stop" disabled
          title="Stop the running cell. This restarts the kernel, so every variable is lost.">Stop</button>
  <button type="button" data-toolbar="restart" title="Discard every variable and start the kernel again">Restart kernel</button>
  <button type="button" data-toolbar="about" title="Versions, and what to paste into a bug report">About</button>
  <span class="status" data-kernel-status role="status" aria-live="polite">starting</span>
</header>

<!-- A <dialog> rather than a div: modal focus containment, Escape to
     close and the top layer all come from the element, and none of them
     are things worth reimplementing badly. -->
<dialog data-about aria-labelledby="about-title">
  <h2 id="about-title">Diluvium Lab</h2>
  <dl data-about-facts></dl>
  <p class="about-note">
    Paste the block below into a bug report — it says exactly which Lab,
    which Diluvium, and which browser.
  </p>
  <pre data-about-report tabindex="0"></pre>
  <div class="about-actions">
    <button type="button" data-about-action="copy">Copy for a bug report</button>
    <button type="button" data-about-action="close">Close</button>
  </div>
</dialog>

<main class="sheet">
  <div class="cells" data-cells></div>
</main>

<section class="console" data-console>
  <div class="console-head">
    <strong>Console</strong>
    <span>— shares the kernel with the notebook. Enter runs; Shift+Enter adds a line.</span>
    <span class="spacer"></span>
    <span data-kernel-backend></span>
  </div>
  <div data-console-log></div>
  <div class="console-input-row">
    <textarea data-console-input rows="1" spellcheck="false" aria-label="console input"></textarea>
  </div>
</section>

<div data-toast hidden role="status" aria-live="polite"></div>

<script type="module">
import { App } from './src/app.js';

// `npm run bake` produces a single double-click-able file and defines this
// global with the kernel inlined, because browsers refuse to fetch over
// file://. Served normally it is undefined and the kernel is fetched.
const inlined = window.DILUVIUM_KERNEL_BASE64;
const app = new App(document, {
  ...(inlined ? { moduleBytes: base64ToBytes(inlined) } : {}),
  ...(devMirrorOverride() ?? {}),
});

/**
 * `?mirror=<url>` points the runtime dropdown somewhere else, for testing a
 * mirror before it is deployed.
 *
 * Honoured only on localhost, deliberately. The Lab downloads a binary and
 * executes it; a query parameter that redirects where that binary comes
 * from would turn any link into "run this wasm", and the checksum check
 * cannot help, since a hostile mirror serves its own SHA256SUMS.txt.
 */
function devMirrorOverride() {
  const local = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
  if (!local) return null;
  const mirrorUrl = new URLSearchParams(location.search).get('mirror');
  return mirrorUrl ? { mirrorUrl } : null;
}

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

window.lab = app;          // the test harness drives the real UI; this is
                           // only for reaching the model in assertions
app.start();
</script>

</body>
</html>
