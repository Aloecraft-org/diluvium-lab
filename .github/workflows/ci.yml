name: CI

# The project's central claim is that every stage ends with a passing
# Playwright test rather than a screenshot and an assertion. Until this
# file existed, that was enforced by whoever happened to be typing
# `npm test`. Now it is enforced on every push and every pull request.
#
# Deliberately small. One job, one browser, no matrix, no caching
# cleverness -- something correct to build on rather than something
# elaborate to debug. Firefox and WebKit are the obvious next step and
# are tracked in ROADMAP.md; adding them here is a matrix entry once the
# Lab is known to pass on them.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI feedback on a
# commit nobody is looking at any more is just queue time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--with-deps` pulls the system libraries Chromium needs on a bare
      # runner. The revision installed is the one @playwright/test pins,
      # which is why package.json pins the Playwright version rather than
      # floating it -- see the note in playwright.config.js.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check the version sources agree
        run: node scripts/check-version.mjs

      # The import map is what pins every module URL to a version. If it is
      # stale, a deploy ships a graph pinned to the previous release.
      - name: Check the import map is current
        run: node scripts/stamp-imports.mjs --check

      - name: Test
        run: npm test
        env:
          CI: 'true'

      # The bake is part of the deliverable, not a side quest: it is the
      # answer to "I want to open one file", and its module-flattening
      # guard (duplicate top-level names, `export default`) fails loudly
      # by design. Catch that here rather than at release time.
      - name: Bake the single-file build
        run: npm run bake

      - name: Check the baked page is self-contained
        run: node scripts/check-bake.mjs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
